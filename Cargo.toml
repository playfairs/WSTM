[package]
name = "wstm"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
bytemuck = { version = "1.16", features = ["derive"] }
cpal = "0.15"
directories = "5.0"
egui = "0.31"
egui-wgpu = "0.31"
egui-winit = "0.31"
glam = "0.29"
image = { version = "0.25", default-features = false, features = ["png"] }
pollster = "0.3"
rfd = "0.15"
rustfft = "6.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
wgpu = "24.0.1"
winit = "0.30"
